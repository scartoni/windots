# yaml-language-server: $schema=https://raw.githubusercontent.com/amnweb/yasb/main/schema.json
# Documentação: https://github.com/amnweb/yasb/wiki

watch_stylesheet: true
watch_config: true
system_colors: true
debug: false
update_check: true

bars:
  primary-bar:
    enabled: true
    screens: ["*"]
    class_name: "yasb-bar"
    alignment:
      position: "top"
      align: "center"
    animation:
      enabled: true
      duration: 300
    blur_effect:
      enabled: false
      round_corners: false
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: "100%"
      height: 30
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    widgets:
      left:
        - "control_center"
        # - "home"
        - "notes"
        - "todo"
        - "wallpapers"
        #- "screenshot"
        - "lightshot"
        #- "bin"
        #- "apps"
        - "komorebi_active_layout"
        - "komorebi_workspaces"
       # - "glazewm_workspaces"
       # - "glazewm_tiling_direction"
       # - "glazewm_binding_mode"
        - "active_window"
        - "window_switcher"
      center:
        - "quick_launch"
        - "clock"
      right:
        - "audio_visualizer"
        - "media"
        - "systray"
        - "bluetooth"

        #- "cpu_temp"
        - "cpu"
        - "memory"
        #- "gpu_temp"
        - "volume"
        - "notifications"
        # - "language"
        - "power_menu"

widgets:
  # Widgets ativos na barra

  home:
    type: "yasb.home.HomeWidget"
    options:
      label: "<span class='icon'>\udb80\udd1b</span>"
      menu_list:
        - { title: "Início", path: "~" }
        - { title: "Downloads", path: "~\\Downloads" }
        - { title: "Documentos", path: "~\\Documents" }
        - { title: "Imagens", path: "~\\Pictures" }
      system_menu: true
      power_menu: false
      blur: false
      round_corners: true
      round_corners_type: "normal"
      border_color: "System"
      alignment: "left"
      offset_left: -12
      menu_labels:
        shutdown: "Desligar"
        restart: "Reiniciar"
        logout: "Sair"
        lock: "Bloquear"
        sleep: "Suspender"
        system: "Configurações"
        about: "Sobre este PC"
        task_manager: "Gerenciador de Tarefas"

  notes:
    type: "yasb.notes.NotesWidget"
    options:
      label: "<span class='icon'>\udb82\udd0c</span>"
      label_alt: "{count} notas"
      menu:
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "left"
        direction: "down"
        offset_top: 6
        offset_left: 0
        show_date_time: true
      icons:
        note: "\uf249"
        delete: "\uf1f8"
        copy: "\uebcc"
        float_on: "\udb84\udcac"
        float_off: "\udb84\udca9"
        close: "\uf00d"
      callbacks:
        on_left: "toggle_menu"
        on_middle: "do_nothing"
        on_right: "toggle_label"

  komorebi_active_layout:
    type: "komorebi.active_layout.ActiveLayoutWidget"
    options:
      label: "{layout_name}"
      hide_if_offline: true
      layouts:
        - "bsp"
        - "columns"
        - "rows"
        - "grid"
        - "vertical_stack"
        - "horizontal_stack"
        - "ultrawide_vertical_stack"
        - "right_main_vertical_stack"
      layout_icons:
        bsp: "\uebeb"
        columns: "\uebf7"
        rows: "\uec01"
        grid: "\udb81\udf58"
        scrolling: "\uebf7"
        vertical_stack: "\uebee"
        horizontal_stack: "\uebf0"
        ultrawide_vertical_stack: "\uebee"
        right_main_vertical_stack: "\uebf1"
        monocle: "\uf06f"
        maximized: "\uf06f"
        floating: "\uf2d2"
        paused: "\udb83\udf89"
        tiling: "\udb81\ude40"
      callbacks:
        on_left: "toggle_layout_menu"
        on_middle: "toggle_monocle"
        on_right: "toggle_pause"
      layout_menu:
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "left"
        direction: "down"
        offset_top: 6
        offset_left: 0
        show_layout_icons: true

  komorebi_workspaces:
    type: "komorebi.workspaces.WorkspaceWidget"
    options:
      label_offline: "<span class='icon'>\u26a1</span> Desconectado"
      label_workspace_btn: "\udb81\udc3d"
      label_workspace_active_btn: "\udb81\udc3e"
      label_workspace_populated_btn: "\udb81\udc3e"
      label_default_name: "{index}"
      label_zero_index: false
      hide_empty_workspaces: false
      hide_if_offline: true
      enable_scroll_switching: true
      toggle_workspace_layer:
        enabled: false
        tiling_label: "Tiling"
        floating_label: "Flutuante"
      app_icons:
        enabled_populated: false
        enabled_active: false
        size: 12
        max_icons: 0
        hide_label: false
        hide_duplicates: false
        hide_floating: false

  # GlazeWM (desativado na barra, definido para uso futuro)

  glazewm_workspaces:
    type: "glazewm.workspaces.GlazewmWorkspacesWidget"
    options:
      offline_label: "<span class='icon'>\u26a1</span> Desconectado"
      hide_if_offline: true
      monitor_exclusive: true
      enable_scroll_switching: true
      app_icons:
        enabled_populated: false
        enabled_active: false
        size: 12
        max_icons: 0
        hide_label: false
        hide_duplicates: false
        hide_floating: false

  glazewm_tiling_direction:
    type: "glazewm.tiling_direction.GlazewmTilingDirectionWidget"
    options:
      horizontal_label: "\udb81\udce1"
      vertical_label: "\udb81\udce2"

  glazewm_binding_mode:
    type: "glazewm.binding_mode.GlazewmBindingModeWidget"
    options:
      label: "<span>{icon}</span> {binding_mode}"
      label_alt: "<span>{icon}</span> Modo atual: {binding_mode}"
      hide_if_no_active: true
      label_if_no_active: "Nenhum modo ativo"
      default_icon: "\uf071"
      icons:
        none: ""
        resize: "\uf071"
        pause: "\uf28c"
      binding_modes_to_cycle_through: ["none", "resize", "pause"]
      callbacks:
        on_left: "next_binding_mode"
        on_middle: "toggle_label"
        on_right: "disable_binding_mode"

  todo:
    type: "yasb.todo.TodoWidget"
    options:
      label: "<span class='icon'>\uf0ae</span>"
      label_alt: "<span class='icon'>\uf0ae</span> Tarefas: {count}"
      # data_path: "~/Documents/my-todos.json" # Caminho customizado
      menu:
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "left"
        direction: "down"
        offset_top: 6
        offset_left: 0
      icons:
        add: "\uf501 Nova tarefa"
        edit: "Editar"
        delete: "Excluir"
        date: "\ue641"
        category: "\uf412"
        checked: "\udb80\udd34"
        unchecked: "\udb80\udd30"
        sort: "\ueab4"
        no_tasks: "\uf4a0"
      categories:
        default:
          label: "Geral"
        soon:
          label: "Completar em breve"
        today:
          label: "Fim do dia"
        urgent:
          label: "Urgente"
        important:
          label: "Importante"
      callbacks:
        on_left: "toggle_menu"
        on_middle: "do_nothing"
        on_right: "toggle_label"

  quick_launch:
    type: "yasb.quick_launch.QuickLaunchWidget"
    options:
      label: ""
      search_placeholder: "Pesquisar aplicativos..."
      max_results: 30
      show_icons: true
      icon_size: 32
      popup:
        width: 450
        height: 432
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        dark_mode: true
      callbacks:
        on_left: "toggle_quick_launch"
      keybindings:
        - keys: "alt+shift+p"
          action: "toggle_quick_launch"
          screen: "primary"

  active_window:
    type: "yasb.active_window.ActiveWindowWidget"
    options:
      label: " {win[title]} "
      label_alt: ""
      label_no_window: ""
      label_icon: true
      label_icon_size: 13
      max_length: 32
      max_length_ellipsis: "..."
      monitor_exclusive: false

  window_switcher:
    type: "yasb.window_switcher.WindowSwitcherWidget"
    options:
      label: "<span>\uf2d2</span>"
      label_alt: ""
      icon_size: 36
      max_visible_apps: 5
      show_title: true
      preview:
        enabled: true
        width: 220
      callbacks:
        on_left: "toggle_window_switcher"
        on_middle: "do_nothing"
        on_right: "do_nothing"
      popup:
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        dark_mode: true
      keybindings:
        - keys: "alt+w"
          action: "toggle_window_switcher"
          screen: "cursor"

  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "{%A, %d %b %H:%M}<span>{alarm}</span>"
      label_alt: "{%a, %d %b %H:%M}"
      locale: "pt_BR"
      timezones: []
      tooltip: false
      calendar:
        blur: false
        round_corners: true
        alignment: "center"
        direction: "down"
        extended: false
        show_years: true
        show_holidays: true
        show_week_numbers: false
      callbacks:
        on_left: "toggle_calendar"

  audio_visualizer:
    type: "yasb.audio_visualizer.AudioVisualizerWidget"
    options:
      style: "bars"
      height: 16
      smoothness: 80
      sensitivity: 50
      auto_gain: true
      framerate: 60
      freq_min: 500
      freq_max: 12000
      hide_idle: true
      hide_idle_after: 2000
      channels: "stereo"
      mono_option: "average"
      reverse: false
      mirror: true
      bars:
        count: 10
        width: 2
        gap: 4
      waves:
        width: 80
      dots:
        count: 30
        size: 1
        gap: 2

  media:
    type: "yasb.media.MediaWidget"
    options:
      label: "<span class='icon'>\udb80\udf87</span> {title}{s}{artist}"
      label_alt: "<span class='icon'>\udb80\udf87</span> {title}{s}{artist}"
      separator: " - "
      hide_empty: true
      callbacks:
        on_left: "toggle_media_menu"
        on_middle: "do_nothing"
        on_right: "do_nothing"
      max_field_size:
        label: 50
        label_alt: 30
      show_thumbnail: false
      controls_only: false
      controls_left: true
      controls_hide: true
      thumbnail_alpha: 80
      thumbnail_padding: 8
      thumbnail_corner_radius: 16
      icons:
        prev_track: "\udb81\udcae"
        next_track: "\udb81\udcad"
        play: "\uf04b"
        pause: "\uf04c"
      media_menu:
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "center"
        direction: "down"
        offset_top: 6
        offset_left: 0
        thumbnail_corner_radius: 8
        thumbnail_size: 120
        max_title_size: 60
        max_artist_size: 50
        show_source: true
      media_menu_icons:
        play: "\uf04b"
        pause: "\uf04c"
        prev_track: "\udb81\udcae"
        next_track: "\udb81\udcad"
      scrolling_label:
        enabled: false
        update_interval_ms: 33
        style: "left" # left, right, bounce ou bounce-ease
        separator: " | "
        label_padding: 0
        always_scroll: false
        ease_slope: 20
        ease_pos: 0.8
        ease_min: 0.5
      progress_bar:
        enabled: false
        alignment: "bottom" # top, bottom ou center

  systray:
    type: "yasb.systray.SystrayWidget"
    options:
      class_name: "systray"
      label_collapsed: "\uf0da"
      label_expanded: "\uf0d7"
      label_position: "left"
      icon_size: 16
      pin_click_modifier: "alt"
      show_unpinned: false
      show_unpinned_button: true
      show_battery: false
      show_volume: false
      show_network: false
      show_in_popup: true
      use_hook: false
      icons_per_row: 3
      hide_icons: []
      popup:
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: "None"
        alignment: "center"
        direction: "down"
        offset_top: 6
        offset_left: 0

  wallpapers:
    type: "yasb.wallpapers.WallpapersWidget"
    options:
      label: "<span class='icon'>\udb83\ude09</span>"
      image_path:
        - "$env:USERPROFILE\\Pictures\\Catppuccin wallpapers"
      change_automatically: false
      update_interval: 1200
      engine:
        enabled: true
        animation: "slide_top" # circle/slide_top/diamond/split
      gallery:
        image_width: 520
        image_corner_radius: 6
        type: "magnified" # default/magnified/strip/slide - see "Gallery types" below
        orientation: "landscape" # landscape/portrait
        # accent_color: "auto"
      callbacks:
        on_left: "toggle_gallery"
        on_middle: "do_nothing"
        on_right: "change_wallpaper"
      keybindings:
        - keys: "ctrl+alt+w"
          action: "toggle_gallery"
          screen: "primary" # active/cursor/primary

  screenshot:
    type: "yasb.custom.CustomWidget"
    options:
      label: "<span class='icon'>\uf50c</span>"
      label_alt: "<span class='icon'>\uf50c</span>"
      class_name: "screenshot-widget"
      exec_options:
        run_once: false
      callbacks:
        on_left: "exec cmd /c start ms-screenclip:"
        on_middle: "exec cmd /c start $env:USERPROFILE\\Pictures"
        on_right: "toggle_label"
      keybindings:
        - keys: "ctrl+alt+s"
          action: "exec cmd /c start ms-screenclip:"
          screen: "cursor"

  lightshot:
    type: "yasb.custom.CustomWidget"
    options:
      label: "<span>\udb80\udef2</span>"
      class_name: "lightshot-widget"
      callbacks:
        on_left: "exec powershell -WindowStyle Hidden -Command \"(New-Object -ComObject wscript.shell).SendKeys('^%x')\""
        on_middle: "do_nothing"
        on_right: "do_nothing"

  bin:
    type: "yasb.recycle_bin.RecycleBinWidget"
    options:
      label: "<span>{icon}</span>"
      label_alt: "{items_count} itens, {items_size}"
      icons:
        bin_empty: "\udb82\ude7a"
        bin_filled: "\udb82\ude79"
      tooltip: true
      show_confirmation: true
      callbacks:
        on_left: "open_bin"
        on_right: "empty_bin"
        on_middle: "toggle_label"

  volume:
    type: "yasb.volume.VolumeWidget"
    options:
      label: "<span class='icon'>{icon}</span> {level}"
      label_alt: "<span class='icon'>{icon}</span> {level}"
      tooltip: true
      icons:
        "muted": "\ueee8"
        "10": "\uf026"
        "30": "\uf027"
        "60": "\uf027"
        "100": "\uf028"
      callbacks:
        on_left: "toggle_volume_menu"
        on_right: "toggle_mute"
      audio_menu:
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
        show_apps: true
        show_app_labels: true
        show_app_icons: true
        show_apps_expanded: true
        app_icons:
          toggle_down: "\uf078"
          toggle_up: "\uf077"

  bluetooth:
    type: "yasb.bluetooth.BluetoothWidget"
    options:
      label: "<span>{icon}</span>"
      label_alt: "<span>{icon}</span> {device_name}"
      label_no_device: "Nenhum dispositivo conectado"
      label_device_separator: ", "
      tooltip: true
      icons:
        bluetooth_on: "\udb80\udcaf"
        bluetooth_off: "\udb80\udcb2"
        bluetooth_connected: "\udb80\udcb0"
      callbacks:
        on_left: "toggle_menu"
        on_middle: "do_nothing"
        on_right: "toggle_label"
      menu_config:
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "center"
        direction: "down"
        offset_top: 6
        offset_left: 0
        labels:
          title: "Bluetooth"
          your_devices: "Seus dispositivos"
          new_devices: "Novos dispositivos"
          not_connected: "Não conectado"
          connected: "Conectado"
          more_settings: "Mais configurações de Bluetooth"
          connect: "Conectar"
          disconnect: "Desconectar"
          connecting: "Conectando"
          disconnecting: "Desconectando"
          pair: "Parear"
          manage: "Gerenciar"
          power_on: "Ligado"
          power_off: "Desligado"

  notifications:
    type: "yasb.notifications.NotificationsWidget"
    options:
      label: "<span class='icon'>\udb80\udc9e</span>"
      label_alt: "{count} notificações"
      hide_empty: true
      tooltip: false
      menu:
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        app_icon_size: 16
      icons:
        new: "\udb80\udc9e"
        default: "\udb80\udc9a"
        dnd_on: "\udb80\udc9b"
        dnd_off: "\udb80\udc9a"
        dismiss: "\uf00d"
      callbacks:
        on_left: "toggle_menu"
        on_middle: "do_nothing"
        on_right: "toggle_notification"

  language:
    type: "yasb.language.LanguageWidget"
    options:
      label: "{lang[language_code]}"
      label_alt: "{lang[full_name]}"
      update_interval: 1
      callbacks:
        on_left: "toggle_menu"
        on_middle: "do_nothing"
        on_right: "toggle_label"
      language_menu:
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        show_layout_icon: true
        layout_icon: "\udb80\udf0c"

  control_center:
    type: "yasb.control_center.ControlCenterWidget"
    options:
      label: "<span>\udb80\udd1b</span>"
      tooltip: true
      sections_order:
        - "system_controls"
        - "quick_actions"
        - "sliders"
        - "power"
        - "media"
      popup:
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "left"
        direction: "down"
        offset_top: 6
        offset_left: 15
      sections:
        system_controls:
          profile_image_size: 28
          power_icon: "\ue7e8"
          lock_icon: "\ue72e"
          settings_icon: "\ue713"
        quick_actions:
          show: true
          columns: 3
          label_position: "default"
          actions:
            - id: "toggle_dnd"
              label: "Não perturbe"
              icon: "\uf285"
            - id: "toggle_mute"
              label: "Mudo"
              icon: "\ue74f"
            - id: "toggle_mic_mute"
              label: "Microfone"
              icon: "\uf12e"
            - id: "screenshot"
              label: "Captura"
              icon: "\ue91b"
            - id: "touch_keyboard"
              label: "Teclado"
              icon: "\ue765"
            - id: "toggle_theme"
              label: "Modo escuro"
              icon: "\ue708"
        sliders:
          show: true
          brightness:
            show_slider: false
            icon: "\ue706"
            show_source_selector: true
            source_selector_icon: "\ue972"
          volume:
            show_slider: true
            icon: "\ue767"
            show_source_selector: true
            source_selector_icon: "\ue972"
          microphone:
            show_slider: true
            icon: "\ue720"
            show_source_selector: true
            source_selector_icon: "\ue972"
        media:
          show: true
          thumbnail_size: 36
          thumbnail_radius: 4
          icons:
            prev_track: "\ue622"
            next_track: "\ue623"
            play: "\uf5b0"
            pause: "\ue62e"
        power:
          show: true
          power_plan_title: "Plano de energia"
          power_mode_title: "Modo de energia"
          button_menu_icon: "\ue76c"
      callbacks:
        on_left: "toggle_menu"

  power_menu:
    type: "yasb.power_menu.PowerMenuWidget"
    options:
      label: "<span class='icon'>\uf011</span>"
      uptime: true
      show_user: true
      menu_style: "popup"
      profile_image_size: 64
      popup:
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "right"
        offset_left: 12
      buttons:
        lock: ["\uDB80\uDF41", "Bloquear"]
        signout: ["\uDB80\uDF43", "Sair"]
        sleep: ["\uDB82\uDD04", "Suspender"]
        hibernate: ["\uDB82\uDD01", "Hibernar"]
        restart: ["\uDB81\uDC53", "Reiniciar"]
        shutdown: ["\uDB82\uDD06", "Desligar"]
        cancel: ["", "Cancelar"]

  apps:
    type: "yasb.applications.ApplicationsWidget"
    options:
      label: "{data}"
      tooltip: true
      app_list:
        - { icon: "\uf489", launch: "wt", name: "Terminal" }
       # - { icon: "\uf473", launch: "cmd /c Taskmgr", name: "Gerenciador de Tarefas" }

  cpu:
    type: "yasb.cpu.CpuWidget"
    options:
      label: "<span>\udb86\udd13</span> {info[percent][total]:.0f}%"
      progress_bar:
        enabled: false
      update_interval: 2000
      callbacks:
        on_left: "toggle_menu"
        on_right: "toggle_menu"
      menu:
        enabled: true
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60

  memory:
    type: "yasb.memory.MemoryWidget"
    options:
      label: "<span>\uefc5</span> {virtual_mem_percent}%"
      label_alt: "<span>\uf4bc</span> VIRT: {virtual_mem_percent}% SWAP: {swap_mem_percent}%"
      update_interval: 5000
      hide_decimal: true
      callbacks:
        on_left: "toggle_menu"
        on_right: "toggle_menu"
      memory_thresholds:
        low: 25
        medium: 50
        high: 90
      histogram_icons:
        - "\u2581"
        - "\u2581"
        - "\u2582"
        - "\u2583"
        - "\u2584"
        - "\u2585"
        - "\u2586"
        - "\u2587"
        - "\u2588"
      menu:
        enabled: true
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60

  cpu_temp:
    type: "yasb.libre_monitor.LibreHardwareMonitorWidget"
    options:
      label: "<span class='icon'>\udb81\ude97</span> {info[value]}{info[unit]}"
      label_alt: "CPU {info[value]}{info[unit]} (mín {info[min]} / máx {info[max]})"
      sensor_id: "/amdcpu/0/temperature/2" # Ryzen 7 5700X, Core (Tctl/Tdie)
      server_host: "localhost"
      server_port: 8085
      update_interval: 2000
      precision: 0
      sensor_id_error_label: "N/D"
      connection_error_label: "LHM offline"
      callbacks:
        on_left: "toggle_label"

  gpu_temp:
    type: "yasb.libre_monitor.LibreHardwareMonitorWidget"
    options:
      label: "<span class='icon'>\udb82\udcae</span> {info[value]}{info[unit]}"
      label_alt: "GPU {info[value]}{info[unit]} (mín {info[min]} / máx {info[max]})"
      sensor_id: "/gpu-nvidia/0/temperature/0" # RTX 3070, GPU Core
      server_host: "localhost"
      server_port: 8085
      update_interval: 2000
      precision: 0
      sensor_id_error_label: "N/D"
      connection_error_label: "LHM offline"
      callbacks:
        on_left: "toggle_label"

  # Widgets definidos e fora da barra

  win_button:
    type: "yasb.custom.CustomWidget"
    options:
      label: "<span class='icon'>\udb80\udd1b</span>"
      label_alt: "<span class='icon'>\udb80\udd1b</span>"
      class_name: "system-widget"
      callbacks:
        on_left: "exec start_menu"

  lines:
    type: "yasb.custom.CustomWidget"
    options:
      label: "\u007c"
      label_alt: "\u007c"
      class_name: "separator-widget"
      callbacks:
        on_left: "do_nothing"

  cava:
    type: "yasb.cava.CavaWidget"
    options:
      bar_height: 12
      waveform: 0
      waves: 0
      monstercat: 0
      sensitivity: 100
      edge_fade: 1
      min_bar_height: 0
      gradient: 0
      foreground: "#b4befe"
      gradient_color_1: "#b4befe"
      gradient_color_2: "#b4befe"
      gradient_color_3: "#b4befe"
      bars_number: 18
      bar_spacing: 2
      bar_width: 4
      bar_type: "waves"
      framerate: 60
      sleep_timer: 2
      hide_empty: true
